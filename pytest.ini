[pytest]
testpaths =
    tests
    packages/hybrid_contracts/tests
    packages/tenant_scope/tests
    packages/clarification_state/tests
    packages/trusted_identity/tests
    packages/document_ingestion/tests
    packages/document_retrieval/tests
    packages/question_router/tests
addopts = --strict-markers
markers =
    integration: needs the live PostgreSQL and Neo4j configured in .env (Golden Data). Deselect with -m "not integration".
