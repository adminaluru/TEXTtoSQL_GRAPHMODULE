[pytest]
testpaths =
    tests
    packages/hybrid_contracts/tests
    packages/tenant_scope/tests
    packages/clarification_state/tests
    packages/trusted_identity/tests
    packages/document_ingestion/tests
    packages/document_retrieval/tests
    packages/question_router/tests
    packages/grounded_answers/tests
addopts = --strict-markers
markers =
    integration: needs PostgreSQL and Neo4j with the Golden Data: the databases in .env locally, or the fixtures in fixtures/golden loaded into test containers (CI). Deselect with -m "not integration".
