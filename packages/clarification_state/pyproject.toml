[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowone-clarification-state"
version = "0.1.0"
description = "Caller-bound, expiring, single-use pending clarification selections"
requires-python = ">=3.11"
dependencies = ["flowone-hybrid-contracts>=0.3,<0.4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
