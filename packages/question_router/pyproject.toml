[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowone-question-router"
version = "0.1.0"
description = "Decide which sources answer a question: rules first, an optional classifier when unsure"
requires-python = ">=3.11"
dependencies = ["flowone-hybrid-contracts>=0.3,<0.4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
